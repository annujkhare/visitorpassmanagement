version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: visitor-pass-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: visitor_pass_db

  
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visitor-pass-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/visitor_pass_db
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-before-production}
    depends_on:
      - mongodb
    ports:
      - "3000:3000"

  
  nginx:
    image: nginx:alpine
    container_name: visitor-pass-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  mongodb_data:
